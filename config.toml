start = 2030-11-01
end = 2030-12-15

# 每篇最下方固定附上的數據連結，自己看趨勢用
[[bookmark]]
name = "Epoch AI"
url = "https://epoch.ai/data"

[[bookmark]]
name = "Our World in Data"
url = "https://ourworldindata.org/"

[[bookmark]]
name = "中選會選舉資料庫"
url = "https://db.cec.gov.tw/"

[feed]
title = "每日頭條"
# 本機測試時可改成 http://<Mac 的 IP>:8000/
site_url = "https://9zxu.github.io/news-digest/"
