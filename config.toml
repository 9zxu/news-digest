# news-digest 設定檔
# 原則：不要錯過最重要的，平常的小事不一定要知道。
#   - 世界、台灣：每天各 1 篇頭條。
#   - 警報、政治參與、AI：只有超過門檻時才出現，沒事就整段不顯示。
#
# method：
#   rss_first        取 feed 的第一篇。只適合「依編輯判斷的重要性排序」的 feed（例如 BBC）。
#   cna_home         中央社首頁最大的那則頭條（抓網頁，不是 RSS；網站改版時可能失效）。
#   wikipedia_itn    維基百科英文版首頁「In the news」最上面的新條目。
#   hn_top           Hacker News 過去 36 小時、標題含 AI 關鍵字、分數最高的一篇；any_topic = true 時不限主題。
#   alphaxiv         alphaXiv 過去 7 天按讚數最高的論文（涵蓋 arXiv cs.AI、cs.CL、cs.LG 等）。
#   hf_papers        Hugging Face Daily Papers 兩天前那一批中按讚數最高的論文（讓按讚數先累積）。
#   github_trending  GitHub Trending 今日第一名（不限 AI）。
# min：門檻（分數、按讚數、今日星星數）。低於門檻就不顯示；每天的實際數字會記在 data/*.json 的 scores，方便調整。

timezone = "Asia/Taipei"
keep_days = 14          # digest.xml 保留最近幾天
summary_chars = 200     # 原文摘要（feed 或網頁自帶的，不是 AI 寫的）最多幾個字

[[category]]
name = "🌍 世界"
each = true   # BBC 每天 1 則；維基百科「新聞動態」有新條目時再加 1 則（標準較全球化，平衡 BBC 偏英國、歐洲的視角）
sources = [
  { name = "BBC World", method = "rss_first", url = "https://feeds.bbci.co.uk/news/world/rss.xml" },
  { name = "Wikipedia 新聞動態", method = "wikipedia_itn" },
]

[[category]]
name = "🇹🇼 台灣"
sources = [
  { name = "中央社", method = "cna_home", url = "https://www.cna.com.tw/" },
  { name = "中央社 政治", method = "rss_first", url = "https://feeds.feedburner.com/rsscna/politics" },
]

[[category]]
name = "💻 Developer"
each = true   # 每個來源各自判斷門檻，可能 0–3 則
sources = [
  { name = "Hacker News", method = "hn_top", min = 300 },
  { name = "Hacker News 熱門", method = "hn_top", any_topic = true, min = 1000 },   # 不限 AI：大當機、重大資安漏洞
  { name = "alphaXiv", method = "alphaxiv", min = 150 },
  { name = "Hugging Face Papers", method = "hf_papers", min = 300 },
  { name = "GitHub Trending", method = "github_trending", min = 1000 },
]

# 只在有事時出現：颱風、寒流、大地震
[alerts]
name = "🚨 警報"
# 中央氣象署：只能原封不動呈現標題並連回原文（見 sources.md 的使用聲明）
cwa_warnings = "https://www.cwa.gov.tw/rss/Data/cwa_warning.xml"
warning_keywords = ["颱風", "低溫"]   # 低溫特報 = 寒流
# 地震：USGS（免 API key），台灣周邊範圍內規模 >= quake_min
quake_min = 6.0
quake_box = { min_lat = 21.0, max_lat = 26.5, min_lon = 119.0, max_lon = 123.0 }

# 只在有事時出現：選舉、公投、罷免
[civic]
name = "🗳️ 公民參與"
url = "https://www.cec.gov.tw/"
countdown_days = 30   # 中選會行事曆上的投票日，進入 30 天內每天顯示倒數
keywords = ["公投", "公民投票", "罷免", "投票日", "投票所", "選舉人名冊", "選舉公報", "登記", "意見發表會", "辯論會"]
exclude = ["訪視", "裁罰", "統計表"]

# 近期大事：一行關鍵字，點進去看背景；事件結束後自動消失
#   - 中央氣象署：颱風警報 →「颱風＋名字」，低溫特報 →「寒流」
#   - 維基百科英文版首頁的「Ongoing」（由編輯維護的進行中國際大事，例如俄烏戰爭），連到中文維基百科條目
#   - 中央社首頁的專題標籤（例如 2026亞運、九合一），排除固定專欄
[hot]
name = "🔥 近期大事"
cna_url = "https://www.cna.com.tw/"
cna_exclude = ["中央社好POD", "特派看世界", "解釋性新聞", "新聞圖表", "AI淨零", "媒體識讀", "2026亞運"]
track_cna_topics = true   # 中央社專題自動加入「📌 追蹤中」，每天附 1 則該專題的新文章

# 事件追蹤：全自動，不用手動設定。
# 每條規則用正規表示式比對 pool 裡過去 36 小時的新聞標題：
#   - 符合的文章數 >= min_hits 才算「有大事」，主題自動出現在「🔥 近期大事」和「📌 追蹤中」（每天 1 則新文章）。
#   - 報導變少、低於 min_hits，就自動消失。小事（只有一兩篇提到）不會出現。
#   - name 可以用 {0}、{1} 帶入 match 裡括號抓到的字，例如 iOS 28。
#   - require：標題還必須包含這些字；exclude：標題包含這些字就不算（例如 beta、傳聞）。
[tracking]
name = "📌 追蹤中"
pool = [
  { name = "BBC World", url = "https://feeds.bbci.co.uk/news/world/rss.xml" },
  { name = "BBC Sport", url = "https://feeds.bbci.co.uk/sport/rss.xml" },
  { name = "中央社 國際", url = "https://feeds.feedburner.com/rsscna/intworld" },
  { name = "中央社 政治", url = "https://feeds.feedburner.com/rsscna/politics" },
  { name = "中央社 體育", url = "https://feeds.feedburner.com/rsscna/sport" },
  { name = "公視新聞網", url = "https://news.pts.org.tw/xml/newsfeed.xml" },
  { name = "MacRumors", url = "https://feeds.macrumors.com/MacRumors-All" },
]

[[watch]]
name = "戰爭／衝突"
match = '(invasion|invades?|declares? war|air ?strikes?|missile (attack|strike)s?|drone attacks?|ceasefire|truce|入侵|空襲|宣戰|開戰|停火|飛彈攻擊|無人機攻擊)'
min_hits = 3

[[watch]]
name = "大地震"
match = '(major earthquake|powerful earthquake|strong earthquake|magnitude[- ][6-9]|強震|大地震|規模[6-9])'
min_hits = 2

[[watch]]
name = "颱風／颶風"
match = '(typhoon|hurricane|cyclone|颱風|颶風|氣旋)'
min_hits = 3

[[watch]]
name = "公民參與"   # 選舉、公投、罷免、學運、罷工、遊行、示威、抗議（國內外）
match = '(general election|presidential election|snap election|early election|election results?|wins? (the )?election|runoff|referendum|recall vote|大選|總統選舉|公投|罷免|學運|罷工|遊行|示威|抗議|general strike|mass protests?|protesters?|student protests?)'
min_hits = 4

[[watch]]
name = "全球政治"   # 政變、彈劾、倒閣、制裁、峰會、領導人下台
match = '(\bcoup\b|impeach\w*|政變|彈劾|sanctions on|制裁|summit|峰會|(prime minister|president|PM) resigns|宣布下台|辭職下台|不信任案|no-confidence)'
min_hits = 2

[[watch]]
name = "兩岸政治"
match = '(解放軍|共軍|共機|共艦|圍台|軍演|台海|台灣海峽|\bPLA\b|Taiwan Strait|\bblockade|國台辦|陸委會|海基會|海協會)'
min_hits = 3

[[watch]]
name = "半導體與科技地緣政治"
match = '(出口管制|export controls?|晶片禁令|chip (ban|curbs|controls)|半導體關稅|chip tariffs?|semiconductor tariffs?|實體清單|entity list)'
min_hits = 2

[[watch]]
name = "重大災難與事故"
match = '(恐攻|terror(ist)? attack|墜機|plane crash|crash (a |the )?plane|劫機|hijack\w*|mass shooting|大規模槍擊|deadly (fire|blast|explosion)|爆炸)'
min_hits = 2

[[watch]]
name = "疫情與公共衛生"
match = '(疫情|pandemic|outbreak|禽流感|bird flu|鼠疫|plague|PHEIC|public health emergency)'
min_hits = 2

[[watch]]
name = "民生大事"
match = '(大停電|分區供電|限電|blackout|power outage|電價|油價|基本工資|停水)'
min_hits = 2

[[watch]]
name = "奧運"
match = '(奧運|olympics?)'
min_hits = 4

[[watch]]
name = "世足"
match = '(世足|世界盃足球|fifa world cup)'
min_hits = 4

# Apple：只追大版本（iOS 28，不含 28.1）的正式發布，以及 WWDC／發表會本身
[[watch]]
name = "{0} {1} 發布"
match = '\b(iOS|iPadOS|macOS|watchOS) (\d{2})\b(?!\.\d)'
require = '(releas|available|launch|unveil|announc|發布|推出)'
exclude = '(beta|\bRC\b|rumou?r|leak|expect|could|might|傳聞|爆料)'
min_hits = 2

[[watch]]
name = "Apple 發表會"
match = '(WWDC|Apple Event|蘋果發表會|keynote)'
exclude = '(rumou?r|expect|could|might|what to|傳聞|爆料)'
min_hits = 2

# 每篇最下方固定附上的數據連結，自己看趨勢用
[[bookmark]]
name = "Epoch AI"
url = "https://epoch.ai/data"

[[bookmark]]
name = "Our World in Data"
url = "https://ourworldindata.org/"

[[bookmark]]
name = "中選會選舉資料庫"
url = "https://db.cec.gov.tw/"

[feed]
title = "每日頭條"
# 本機測試時可改成 http://<Mac 的 IP>:8000/
site_url = "https://9zxu.github.io/news-digest/"
